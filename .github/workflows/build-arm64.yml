name: Build linux-arm64

# Native ARM64 build of MagicPodsCore on GitHub's free arm runner (public repos),
# without Docker. It mirrors MagicPodsDecky/backend/Dockerfile: ubuntu 22.04
# (glibc 2.35 baseline), a private minimal FFmpeg 4.4.8 under /opt/ffmpeg,
# and a patched RUNPATH so the binary finds its two FFmpeg libs in ./lib.
#
# Branch pushes produce an artifact only. Pushing a tag named like
# 2.0.12-frame.1 also creates a DRAFT GitHub release with the tarball, its
# sha256 and a corresponding-source tarball; a person reviews and publishes it.

on:
  workflow_dispatch:
  push:
    tags:
      # Path filters below do not apply to tag pushes.
      - '*-frame.*'
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'dependencies/**'
      - 'config/**'
      - 'CMakeLists.txt'
      - 'frame/**'
      - 'menu/**'
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash with -eo pipefail
    shell: bash

env:
  FFMPEG_VERSION: '4.4.8'
  FFMPEG_SHA256: 'c73848c4ae283d9eaee7be3b276affbc3543380483555500d0dd2c9b7e1c39c3'
  FFMPEG_PREFIX: /opt/ffmpeg
  # Same flags as the Dockerfile (minus --prefix, which is FFMPEG_PREFIX above).
  # One flag per line; the cache key is a hash of this text.
  FFMPEG_CONFIGURE_FLAGS: |
    --disable-everything
    --disable-autodetect
    --disable-programs
    --disable-doc
    --disable-debug
    --disable-static
    --enable-shared
    --enable-small
    --enable-decoder=aac
    --disable-avdevice
    --disable-avfilter
    --disable-avformat
    --disable-network
    --disable-postproc
    --disable-swresample
    --disable-swscale
  DIST_NAME: magicpodscore-linux-arm64
  MENU_NAME: magicpods-frame-menu

jobs:
  build:
    name: magicpodscore (linux-arm64, glibc 2.35)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one-click installer (frame/magicpods-frame-install.py, started by
      # Install-Tragus.desktop): offline tests for its signature check and unpacking.
      - name: Test the Frame installer
        run: |
          python3 -m py_compile frame/magicpods-frame-install.py
          python3 -m unittest discover -s frame -p 'test_*.py' -v
          sh -n frame/install.sh
          sh -n frame/uninstall.sh
          for f in frame/Install-Tragus.desktop frame/Uninstall-Tragus.desktop; do
            grep -qF "Exec=konsole --hold -e python3 -I -c \"import urllib.request as u; exec(u.urlopen('https://github.com/jimas21/tragus/releases/latest/download/magicpods-frame-install.py', timeout=60).read())\"" "$f"
            ! grep -q '/tmp' "$f"
          done

      # The MagicPods menu for Steam's VR UI (menu/), released beside the build.
      - name: Check the menu
        run: |
          node --check menu/magicpods-menu.js
          python3 -m py_compile menu/magicpods-steamui.py
          sh -n menu/install.sh
          sh -n menu/uninstall.sh
          if LC_ALL=C grep -nP '[\x00-\x08\x0b\x0c\x0e-\x1f]' menu/magicpods-menu.js menu/magicpods-steamui.py; then
            echo "::error::control characters in the menu files"; exit 1
          fi

      # Package list is the Dockerfile's, minus nasm (x86 only), doxygen and graphviz
      # (CMakeLists.txt does not use them; sdbus-c++ v1.6.0 only runs doxygen when
      # BUILD_DOXYGEN_DOC is on, and that defaults to OFF). `file` is added for the
      # verify step. git is needed because uSockets/uWebSockets are fetched by
      # CMake FetchContent at configure time (dependencies/ is NOT vendored).
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gcc \
            g++ \
            make \
            pkg-config \
            ca-certificates \
            curl \
            libsystemd-dev \
            git \
            patchelf \
            xz-utils \
            zlib1g-dev \
            libbluetooth-dev \
            libpulse-dev \
            libssl-dev \
            file
          echo "--- toolchain"
          uname -m
          ldd --version | head -n1
          gcc --version | head -n1
          cmake --version | head -n1
          patchelf --version

      - name: Compute FFmpeg cache key
        id: ffkey
        run: |
          flags_hash="$(printf '%s\n%s\n' "--prefix=${FFMPEG_PREFIX}" "${FFMPEG_CONFIGURE_FLAGS}" | sha256sum | cut -c1-16)"
          echo "flags_hash=${flags_hash}"
          echo "hash=${flags_hash}" >> "$GITHUB_OUTPUT"

      # The prefix is under /opt, so make it writable for the runner user before
      # actions/cache restores into it and before make install writes to it.
      - name: Prepare FFmpeg prefix
        run: |
          sudo mkdir -p "${FFMPEG_PREFIX}"
          sudo chown "$(id -u):$(id -g)" "${FFMPEG_PREFIX}"

      # restore + save are split so FFmpeg is cached as soon as it is built,
      # even if a later step (cmake, verify) fails and the job ends red.
      - name: Restore FFmpeg cache
        id: ffcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ steps.ffkey.outputs.hash }}-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-v1

      - name: Build FFmpeg ${{ env.FFMPEG_VERSION }}
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          set -f   # the flags are word-split below; never glob them
          src="${RUNNER_TEMP}/ffmpeg-src"
          mkdir -p "${src}"
          curl -fsSL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            -o "${RUNNER_TEMP}/ffmpeg.tar.xz"
          echo "${FFMPEG_SHA256}  ${RUNNER_TEMP}/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/ffmpeg.tar.xz" -C "${src}" --strip-components=1
          cd "${src}"
          # shellcheck disable=SC2086
          ./configure --prefix="${FFMPEG_PREFIX}" ${FFMPEG_CONFIGURE_FLAGS}
          make -j"$(nproc)"
          make install
          find "${FFMPEG_PREFIX}/lib" -type f \
            \( -name 'libavcodec.so.*' -o -name 'libavutil.so.*' \) \
            -exec strip --strip-unneeded {} +
          # LGPL text to ship next to the bundled libraries (not in the Dockerfile).
          cp COPYING.LGPLv2.1 "${FFMPEG_PREFIX}/COPYING.LGPLv2.1"

      - name: Check FFmpeg libraries
        run: |
          for f in lib/libavcodec.so.58 lib/libavutil.so.56 lib/pkgconfig/libavcodec.pc lib/pkgconfig/libavutil.pc COPYING.LGPLv2.1; do
            test -e "${FFMPEG_PREFIX}/${f}" || { echo "::error::missing ${FFMPEG_PREFIX}/${f}"; exit 1; }
          done
          ls -l "${FFMPEG_PREFIX}/lib" | grep -E 'libav(codec|util)\.so'

      - name: Save FFmpeg cache
        if: steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ steps.ffkey.outputs.hash }}-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-v1

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="${FFMPEG_PREFIX}/lib/pkgconfig"
          export LD_LIBRARY_PATH="${FFMPEG_PREFIX}/lib"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          export PKG_CONFIG_PATH="${FFMPEG_PREFIX}/lib/pkgconfig"
          export LD_LIBRARY_PATH="${FFMPEG_PREFIX}/lib"
          cmake --build build --parallel "$(nproc)"

      - name: Assemble dist/
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -f   # the flags are word-split below; never glob them
          rm -rf dist
          mkdir -p dist/lib
          cp build/magicpodscore dist/magicpodscore
          cp -L "${FFMPEG_PREFIX}/lib/libavcodec.so.58" dist/lib/
          cp -L "${FFMPEG_PREFIX}/lib/libavutil.so.56" dist/lib/
          # Single quotes: the literal text $ORIGIN/lib must reach patchelf.
          patchelf --set-rpath '$ORIGIN/lib' dist/magicpodscore
          cp LICENSE dist/LICENSE
          # Installer for ARM64 SteamOS headsets (systemd --user service).
          cp frame/install.sh frame/uninstall.sh frame/magicpodscore.service dist/
          # The updater the MagicPods menu runs ("Check for updates", automatic updates).
          cp frame/magicpods-frame-install.py dist/
          chmod 755 dist/install.sh dist/uninstall.sh dist/magicpods-frame-install.py
          chmod 644 dist/magicpodscore.service
          cp "${FFMPEG_PREFIX}/COPYING.LGPLv2.1" dist/lib/FFMPEG-COPYING.LGPLv2.1

          version="$(sed -n 's/^project(magicpodscore VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          {
            echo "MagicPodsCore ${version} (linux-arm64 build)"
            echo
            echo "This program is licensed under the GNU GPL v3 (see LICENSE)."
            echo "Corresponding source code for this exact build:"
            echo "  repository: ${SERVER_URL}/${REPOSITORY}"
            echo "  commit:     ${COMMIT_SHA}"
            echo "  tree:       ${SERVER_URL}/${REPOSITORY}/tree/${COMMIT_SHA}"
            echo "  built by:   ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID} (ref ${REF_NAME})"
            echo "Upstream project: https://github.com/steam3d/MagicPodsCore"
            echo "Build recipe: .github/workflows/build-arm64.yml in that commit."
            echo
            echo "Bundled in lib/ (dynamically linked, replaceable):"
            echo "  libavcodec.so.58, libavutil.so.56 from FFmpeg ${FFMPEG_VERSION}"
            echo "  source:  https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
            echo "  sha256:  ${FFMPEG_SHA256}"
            echo "  license: LGPL v2.1 or later (configured without --enable-gpl); text in lib/FFMPEG-COPYING.LGPLv2.1"
            echo "  configure flags: --prefix=${FFMPEG_PREFIX}"
            printf '    %s\n' ${FFMPEG_CONFIGURE_FLAGS}
            echo
            echo "Statically linked from sources fetched by CMake at build time"
            echo "(see dependencies/*/CMakeLists.txt in the commit above for exact versions):"
            echo "  sdbus-c++, uSockets, uWebSockets, nlohmann/json, toml++"
          } > dist/SOURCE.txt
          cat dist/SOURCE.txt
          ls -lR dist

      - name: Verify dist/
        run: |
          set -u
          fail() { echo "::error::verify failed: $*"; exit 1; }
          # The loader must find the FFmpeg libs through RUNPATH alone.
          unset LD_LIBRARY_PATH
          bin=dist/magicpodscore

          echo "--- file"
          desc="$(file -b "${bin}")"
          echo "${desc}"
          [[ "${desc}" == *"ELF 64-bit"* && "${desc}" == *"ARM aarch64"* ]] || fail "binary is not ELF ARM aarch64"
          for lib in dist/lib/libavcodec.so.58 dist/lib/libavutil.so.56; do
            d="$(file -b "${lib}")"
            [[ "${d}" == *"ARM aarch64"* ]] || fail "${lib} is not ARM aarch64: ${d}"
          done

          echo "--- dynamic section (RPATH/RUNPATH)"
          dyn="$(readelf -d "${bin}")"
          rp="$(grep -E '\((RPATH|RUNPATH)\)' <<<"${dyn}" || true)"
          echo "${rp}"
          [[ -n "${rp}" ]] || fail "no RPATH/RUNPATH entry"
          # Exactly this value, so no stray /opt/ffmpeg path survives.
          [[ "$(wc -l <<<"${rp}")" -eq 1 && "${rp}" == *'[$ORIGIN/lib]' ]] || fail 'RUNPATH/RPATH is not exactly $ORIGIN/lib'

          echo "--- NEEDED"
          grep -E '\(NEEDED\)' <<<"${dyn}"

          echo "--- ldd"
          ddd="$(ldd "${bin}")"
          echo "${ddd}"
          if grep -q 'not found' <<<"${ddd}"; then fail "unresolved shared library (see ldd above)"; fi
          for lib in libavcodec.so.58 libavutil.so.56; do
            line="$(grep -F "${lib} =>" <<<"${ddd}")" || fail "${lib} not listed by ldd"
            resolved="$(awk '{print $3}' <<<"${line}")"
            [[ "$(readlink -f "${resolved}")" == "$(readlink -f "dist/lib/${lib}")" ]] \
              || fail "${lib} resolved to ${resolved}, expected dist/lib/${lib}"
          done

          echo "--- highest glibc symbol version required"
          maxver() {  # $1 = prefix (GLIBC or GLIBCXX), rest = files
            local p="$1"; shift
            { objdump -T "$@" 2>/dev/null | grep -o "${p}_[0-9][0-9.]*" || true; } | sed "s/^${p}_//" | sort -uV | tail -n1
          }
          glibc_max="$(maxver GLIBC "${bin}" dist/lib/libavcodec.so.58 dist/lib/libavutil.so.56)"
          echo "GLIBC_${glibc_max} (binary + bundled libs)"
          echo "GLIBC_$(maxver GLIBC "${bin}") (binary alone)"
          echo "GLIBCXX_$(maxver GLIBCXX "${bin}") (binary alone, libstdc++ must provide it)"
          [[ -n "${glibc_max}" ]] || fail "could not determine the GLIBC version"
          [[ "$(printf '%s\n' "${glibc_max}" 2.35 | sort -V | tail -n1)" == "2.35" ]] \
            || fail "requires glibc ${glibc_max}, above the 2.35 baseline"

          {
            echo "### magicpodscore linux-arm64"
            echo "- file: ${desc}"
            echo "- highest GLIBC required: ${glibc_max}"
            echo '- needed libraries:'
            echo '```'
            grep -E '\(NEEDED\)' <<<"${dyn}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Informational only. It will usually fail on a CI runner (no BlueZ/D-Bus
      # services, no Bluetooth adapter); what matters is that it starts and the
      # loader does not complain about missing libraries. It also shows the
      # listening addresses (expect 127.0.0.1:2020 and [::1]:2020 only) and the
      # config file mode (expect 600, and no leftover temporary files).
      - name: Smoke run (non-fatal)
        continue-on-error: true
        run: |
          unset LD_LIBRARY_PATH
          export HOME="${RUNNER_TEMP}/home"
          export XDG_CONFIG_HOME="${HOME}/.config"   # the runner sets its own
          mkdir -p "${HOME}"
          set +e
          ./dist/magicpodscore > "${RUNNER_TEMP}/smoke.log" 2>&1 &
          pid=$!
          # Both loopback listeners are bound before initialization; initialization
          # (D-Bus, PulseAudio) can take a few seconds without those services, so
          # wait up to 20 s for it.
          for _ in $(seq 1 20); do
            sleep 1
            kill -0 "${pid}" 2>/dev/null || break
            grep -q 'Initialization complete' "${RUNNER_TEMP}/smoke.log" && { sleep 1; break; }
          done
          echo "--- listeners on port 2020"
          ss -ltn 'sport = :2020'
          echo "--- config directory"
          ls -la "${XDG_CONFIG_HOME}/magicpods"
          stat -c '%a %n' "${XDG_CONFIG_HOME}/magicpods" "${XDG_CONFIG_HOME}/magicpods/config.toml"
          if kill -0 "${pid}" 2>/dev/null && ! grep -q 'Initialization complete' "${RUNNER_TEMP}/smoke.log"; then
            echo "--- initialization did not finish; thread stacks"
            sudo apt-get install -y -qq gdb > /dev/null 2>&1
            sudo gdb -p "${pid}" -batch -ex 'thread apply all bt 12' 2>/dev/null | grep -E '^Thread|^#'
          fi
          kill "${pid}" 2>/dev/null
          wait "${pid}"
          echo "exit code: $? (143 = still running and stopped by the test, which is fine)"
          echo "--- output"
          cat "${RUNNER_TEMP}/smoke.log"
          exit 0

      - name: Package
        run: |
          mkdir -p out
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --transform "s,^dist,${DIST_NAME}," \
              -czf "out/${DIST_NAME}.tar.gz" dist
          (cd out && sha256sum "${DIST_NAME}.tar.gz" > "${DIST_NAME}.tar.gz.sha256")
          ls -l out
          cat "out/${DIST_NAME}.tar.gz.sha256"
          tar -tzvf "out/${DIST_NAME}.tar.gz"

      # Tags only: everything needed to rebuild this binary, for the GPL (and the
      # LGPL for FFmpeg): this commit, the dependency sources CMake fetched, and
      # the FFmpeg release tarball.
      - name: Corresponding source (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          name="${DIST_NAME}-source"
          root="${RUNNER_TEMP}/${name}"
          rm -rf "${root}"
          mkdir -p "${root}/deps"
          git archive --format=tar --prefix="magicpodscore/" HEAD | tar -x -C "${root}"
          for d in build/_deps/*-src; do
            tar -C build/_deps --exclude=.git -cf - "$(basename "${d}")" | tar -x -C "${root}/deps"
          done
          curl -fsSL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"             -o "${root}/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          echo "${FFMPEG_SHA256}  ${root}/ffmpeg-${FFMPEG_VERSION}.tar.xz" | sha256sum -c -
          cp dist/SOURCE.txt "${root}/SOURCE.txt"
          ls "${root}" "${root}/deps"
          tar --sort=name --owner=0 --group=0 --numeric-owner               -C "${RUNNER_TEMP}" -czf "out/${name}.tar.gz" "${name}"
          (cd out && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l out

      - name: Upload source artifact (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magicpodscore-linux-arm64-source
          path: |
            out/magicpodscore-linux-arm64-source.tar.gz
            out/magicpodscore-linux-arm64-source.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magicpodscore-linux-arm64
          path: |
            out/magicpodscore-linux-arm64.tar.gz
            out/magicpodscore-linux-arm64.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error

  # Tags only. Creates a DRAFT release; nothing is public until a person
  # publishes it. Fails if a release for this tag already exists.
  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: magicpodscore-linux-arm64
          path: out

      - name: Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: magicpodscore-linux-arm64-source
          path: out

      # The installer, its Desktop Mode launchers and the menu, published beside the
      # build so that releases/latest/download/<name> always finds them.
      - name: Check out the installer and the menu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: |
            frame
            menu
          persist-credentials: false

      - name: Package the menu
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          d="menu-dist/${MENU_NAME}"
          rm -rf menu-dist && mkdir -p "${d}"
          cp src/menu/magicpods-menu.js src/menu/magicpods-steamui.py src/menu/magicpods-steamui.service \
             src/menu/install.sh src/menu/uninstall.sh src/menu/README.md src/LICENSE "${d}/"
          chmod 755 "${d}/install.sh" "${d}/uninstall.sh" "${d}/magicpods-steamui.py"
          chmod 644 "${d}/magicpods-menu.js" "${d}/magicpods-steamui.service" "${d}/README.md" "${d}/LICENSE"
          {
            echo "Tragus menu for Steam's VR UI, ${TAG}"
            echo
            echo "License: GNU GPL v3 (see LICENSE). These files are their own source code."
            echo "  repository: ${SERVER_URL}/${REPOSITORY}"
            echo "  commit:     ${COMMIT_SHA}"
            echo "  tree:       ${SERVER_URL}/${REPOSITORY}/tree/${COMMIT_SHA}/menu"
            echo "Based on MagicPods for Linux and MagicPods for Decky (GPL-3.0):"
            echo "  https://github.com/steam3d/MagicPodsLinux"
            echo "  https://github.com/steam3d/MagicPodsDecky"
          } > "${d}/SOURCE.txt"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git -C src log -1 --format=%ct)" \
              -C menu-dist -czf "out/${MENU_NAME}.tar.gz" "${MENU_NAME}"
          (cd out && sha256sum "${MENU_NAME}.tar.gz" > "${MENU_NAME}.tar.gz.sha256")
          cat "out/${MENU_NAME}.tar.gz.sha256"
          tar -tzvf "out/${MENU_NAME}.tar.gz"

      # ed25519 signature over the exact tarball bytes, for clients that install
      # updates automatically. The seed is the MP_RELEASE_KEY secret (a '#' comment
      # line, then base64 of the 32-byte seed); the matching public key is pinned
      # here and checked, so a wrong or rotated secret fails the job.
      - name: Sign the tarballs
        env:
          MP_RELEASE_KEY: ${{ secrets.MP_RELEASE_KEY }}
          MP_RELEASE_PUBKEY: 'GOT1qW3jXgAMmr3pyoQece9CnIIrNlgiZysjnNC/Hdk='
        run: |
          python3 -m venv "${RUNNER_TEMP}/sign"
          "${RUNNER_TEMP}/sign/bin/pip" install --quiet 'cryptography==44.0.0'
          "${RUNNER_TEMP}/sign/bin/python" - "out/${DIST_NAME}.tar.gz" "out/${MENU_NAME}.tar.gz" <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey, Ed25519PublicKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          lines = [l.strip() for l in os.environ.get("MP_RELEASE_KEY", "").splitlines()]
          lines = [l for l in lines if l and not l.startswith("#")]
          if len(lines) != 1:
              sys.exit("MP_RELEASE_KEY: expected one base64 seed line after the comment")
          seed = base64.b64decode(lines[0], validate=True)
          if len(seed) != 32:
              sys.exit("MP_RELEASE_KEY: seed is not 32 bytes")
          key = Ed25519PrivateKey.from_private_bytes(seed)
          pub = key.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)
          if base64.b64encode(pub).decode() != os.environ["MP_RELEASE_PUBKEY"]:
              sys.exit("MP_RELEASE_KEY does not match the pinned public key")
          for path in sys.argv[1:]:
              data = open(path, "rb").read()
              sig = key.sign(data)
              Ed25519PublicKey.from_public_bytes(base64.b64decode(os.environ["MP_RELEASE_PUBKEY"])).verify(sig, data)
              with open(path + ".sig", "w") as out:
                  out.write(base64.b64encode(sig).decode())
                  out.write(chr(10))
              print("signed", path, "and verified with the pinned public key")
          PY
          cat "out/${DIST_NAME}.tar.gz.sig" "out/${MENU_NAME}.tar.gz.sig"


      - name: Add the installer
        run: |
          for f in magicpods-frame-install.py Install-Tragus.desktop Uninstall-Tragus.desktop; do
            cp "src/frame/${f}" "out/${f}"
          done
          (cd out && sha256sum magicpods-frame-install.py Install-Tragus.desktop Uninstall-Tragus.desktop > installer.sha256)
          cat out/installer.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cd out
          sha256sum -c "${DIST_NAME}.tar.gz.sha256" "${DIST_NAME}-source.tar.gz.sha256" "${MENU_NAME}.tar.gz.sha256"
          bin_sha="$(cut -d' ' -f1 "${DIST_NAME}.tar.gz.sha256")"
          {
            echo "Tragus for the Steam Frame: the core service (built on MagicPodsCore) and the menu,"
            echo "from commit ${SHA} (built by ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})."
            echo
            echo "- \`${DIST_NAME}.tar.gz\`: binary, bundled FFmpeg libs (AAC decoder only), licences, SOURCE.txt"
            echo "  sha256 \`${bin_sha}\`; ed25519 signature in \`${DIST_NAME}.tar.gz.sig\`"
            echo "- \`${DIST_NAME}-source.tar.gz\`: corresponding source (this commit, the dependency"
            echo "  sources CMake fetched, and the FFmpeg release tarball)"
            echo
            echo "- \`${MENU_NAME}.tar.gz\`: the Tragus menu for Steam's VR UI (signed the same way)"
            echo "- \`Install-Tragus.desktop\`: one-click install or update of Tragus on a Steam Frame."
            echo "  It runs \`magicpods-frame-install.py\`, which downloads the Tragus core and menu from"
            echo "  the latest release, checks their signatures and installs both."
            echo "  \`Uninstall-Tragus.desktop\` removes them (settings kept). Hashes in \`installer.sha256\`."
            echo
            echo "Install: see ${SERVER_URL}/${REPO}#install"
            echo "License: GPL-3.0 (Tragus, like MagicPodsCore), LGPL-2.1-or-later (bundled FFmpeg libraries)."
          } > notes.md
          cat notes.md
          gh release create "${TAG}" --repo "${REPO}" --draft --verify-tag \
            --title "Tragus ${TAG}" --notes-file notes.md \
            "${DIST_NAME}.tar.gz" "${DIST_NAME}.tar.gz.sha256" "${DIST_NAME}.tar.gz.sig" \
            "${DIST_NAME}-source.tar.gz" "${DIST_NAME}-source.tar.gz.sha256" \
            "${MENU_NAME}.tar.gz" "${MENU_NAME}.tar.gz.sha256" "${MENU_NAME}.tar.gz.sig" \
            magicpods-frame-install.py Install-Tragus.desktop Uninstall-Tragus.desktop installer.sha256
